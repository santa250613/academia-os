<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Academia OS · Clases</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="wrap">
  <header><div class="brand">Academia<b>OS</b> · Clases</div><a class="tag" href="dashboard.html">← Dashboard</a></header>
  <p class="sub">Toca la tarjeta de una clase para ver y editar quiénes conforman el grupo.</p>

  <div class="toolbar">
    <label for="fecha">Asistencia del día:</label>
    <input type="date" id="fecha">
    <span id="resumenDia"></span>
  </div>

  <div class="grid" id="gr"></div>
  <div id="dets"></div>
  <footer>Academia OS — prototipo académico</footer>
</div>

<script src="../backend/clientes/clientes.js?v=3"></script>
<script src="../backend/pagos/pagos.js?v=3"></script>
<script src="../backend/asistencias/asistencias.js?v=3"></script>
<script>
const CS=AOS.classes(), esc=AOS.esc;
let abierto=null, fecha=AOS.hoy();
const inp=document.getElementById('fecha');
inp.value=fecha;
inp.addEventListener('change',()=>{ fecha=inp.value||AOS.hoy(); render(); });

/* pastilla de asistencia del día elegido */
function pillAsis(x){
  const d=AOSAsis.estadoDia(x,fecha);
  if(d.estado==='asistio') return `<span class="pill ok">✔ Asistió · ${esc(d.hora)}</span>`;
  if(d.estado==='futuro')  return `<span class="pill pend">Por venir</span>`;
  return `<span class="pill bad">✖ Falta</span>`;
}
/* pastilla de pago: MISMA regla que dashboard y clientes */
function pillPago(x){ return `<span class="pill ${AOS.pillClass(x)}">${AOS.estadoLabel(x)}</span>`; }

function lista(k,detail){
  const g=AOSAsis.grupo(k);
  if(!g.length) return '<li style="color:var(--mut)">Sin alumnos aún — agrégalo abajo ↓</li>';
  return g.map((x,i)=>{
    const motivo=AOS.motivo(x);
    const extra=detail?`<span class="meta">🎯 ${AOS.restantes(x)} de ${AOS.packLabel(x.paq)} restantes${motivo?' · '+motivo:''}</span>`:'';
    const del=detail?`<button class="del" title="Quitar del grupo" aria-label="Quitar a ${esc(x.n)} del grupo" onclick="quitar('${x.id}',event)">✕</button>`:'';
    return `<li class="${AOS.isPending(x)?'pend':'act'}">
      <span class="who"><span class="n-pos">${i+1}.</span><span class="nm">${esc(x.n)}</span>${extra}</span>
      <span class="tags">${pillAsis(x)}${pillPago(x)}${del}</span>
    </li>`;}).join('');
}

function render(){
  let totalAsistieron=0;
  document.getElementById('gr').innerHTML=Object.keys(CS).map(k=>{
    const g=AOSAsis.grupo(k);
    const act=g.filter(x=>!AOS.isPending(x)).length;
    const vino=g.filter(x=>AOSAsis.estadoDia(x,fecha).estado==='asistio').length;
    totalAsistieron+=vino;
    return `<div class="card" onclick="toggle('${k}')">
      <h2>${CS[k]}</h2>
      <p class="hor">${act} al día · ${g.length-act} pendientes · ${g.length} alumnos · ✔ ${vino} asistieron</p>
      <ul>${lista(k,false)}</ul>
      <p class="abrir">${abierto===k?'▲ Cerrar gestión del grupo':'▼ Ver grupo y agregar/eliminar alumnos'}</p>
    </div>`;}).join('');
  document.getElementById('resumenDia').textContent=`${totalAsistieron} asistencias registradas ese día`;

  document.getElementById('dets').innerHTML=Object.keys(CS).filter(k=>k===abierto).map(k=>{
    const otros=AOS.all().filter(x=>x.clase!==k);
    const opts=otros.length?otros.map(x=>`<option value="${x.id}">${esc(x.n)}</option>`).join(''):'<option value="">— no hay clientes sin clase —</option>';
    return `<div class="panel det">
      <h2>${CS[k]} · gestión del grupo</h2>
      <p class="hor">Orden: alumnos al día arriba; mensualidad vencida o por iniciar al final en gris.</p>
      <div class="det-grid">
        <div class="lis"><ul>${lista(k,true)}</ul></div>
        <div>
          <div class="addrow">
            <select id="sel-${k}" aria-label="Alumno a agregar">${opts}</select>
            <button class="btn add" onclick="agregar('${k}')">+ Agregar al grupo</button>
          </div>
          <p class="tiny">La asistencia se marca sola cuando el alumno escanea el sticker NFC. Si ya usó todas las clases de su paquete, pasa a <b>Mensualidad vencida</b> hasta renovar el pago.</p>
          <p class="tiny">✕ quita a la persona del grupo (puede añadirse después a otra clase desde aquí).</p>
        </div>
      </div>
    </div>`;}).join('');
}
function toggle(k){ abierto=abierto===k?null:k; render(); }
function agregar(k){ const s=document.getElementById('sel-'+k); if(s&&s.value){ AOS.addClass(s.value,k); render(); } }
function quitar(id,e){ e.stopPropagation(); AOS.removeFromClass(id); render(); }

render();
AOS.onChange(render);   // si alguien marca ingreso en check.html, esta vista se actualiza sola
</script>
</body>
</html>
