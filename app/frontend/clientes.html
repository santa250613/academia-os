<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Academia OS · Clientes</title>
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
<div class="wrap">
  <header><div class="brand">Academia<b>OS</b> · Clientes</div><a class="tag" href="dashboard.html">← Dashboard</a></header>
  <p class="sub">Todas las clientas y bailarines · modifica la clase, el paquete y registra el pago presencial. Los cambios se reflejan en Clases y Dashboard.</p>
  <div class="panel">
    <div class="tablewrap">
      <table class="rt">
        <thead><tr><th>Nombre</th><th>Celular</th><th>Clase</th><th>Estado</th><th>Paquete</th><th>Restantes</th><th>Pago presencial</th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
  <footer>Academia OS — prototipo académico</footer>
</div>

<script src="../backend/clientes/clientes.js?v=3"></script>
<script src="../backend/pagos/pagos.js?v=3"></script>
<script>
const CS=AOS.classes(), esc=AOS.esc;

function render(){
  document.getElementById('tb').innerHTML=AOS.all().map(x=>{
    const motivo=AOS.motivo(x);
    return `<tr>
    <td data-label="Nombre">${esc(x.n)}</td>
    <td data-label="Celular" style="color:var(--mut)">${esc(x.tel)}</td>
    <td data-label="Clase"><select aria-label="Clase de ${esc(x.n)}" onchange="setClase('${x.id}',this.value)">
      <option value="">Sin clase</option>
      ${Object.keys(CS).map(k=>`<option value="${k}" ${x.clase===k?'selected':''}>${CS[k]}</option>`).join('')}
    </select></td>
    <td data-label="Estado"><span class="saved" id="s-${x.id}"></span><span class="pill ${AOS.pillClass(x)}">${AOS.estadoLabel(x)}</span>${motivo?`<br><span class="m-sub">${motivo}</span>`:''}</td>
    <td data-label="Paquete"><select aria-label="Paquete de ${esc(x.n)}" onchange="setPaq('${x.id}',this.value)">${[4,8,12,'mensual'].map(p=>`<option value="${p}" ${String(p)===x.paq?'selected':''}>${AOS.packLabel(p)}</option>`).join('')}</select></td>
    <td data-label="Restantes">${AOS.restantes(x)}</td>
    <td data-label="Pago">${AOS.estado(x)==='al_dia'?'<span style="color:var(--mut)">—</span>':`<button class="btn pay" onclick="pagar('${x.id}')">💵 Pagar hoy</button>`}</td></tr>`;}).join('');
}
function setClase(id,c){ AOS.setClase(id,c); render(); flash(id,'clase ✓'); }
function setPaq(id,p){ AOS.update(id,{paq:p}); render(); flash(id,'paquete ✓'); }
function pagar(id){ AOSPagos.pagarPresencial(id); render(); flash(id,'pago ✓'); }
function flash(id,t){ const el=document.getElementById('s-'+id); if(!el) return; el.textContent=t; setTimeout(()=>el.textContent='',1400); }

render();
AOS.onChange(render);
</script>
</body>
</html>
